<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urlaub mit Kirschli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf3ef;
      --text: #3b1f26;
      --accent: #e8005a;
      --accent-hover: #c40050;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1316;
        --text: #f7e6ea;
        --accent: #e8005a;
        --accent-hover: #ff1a75;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Open Sans", Arial, sans-serif;
    }
    .video {
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }
    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .button {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 999px;
      transition: background 0.2s;
    }
    .button:hover { background: var(--accent-hover); }
    .button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>

  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/x2hIM4py3z4?autoplay=1&mute=1&playsinline=1&rel=0"
      title="Video"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <a class="button" href="https://urlaub-mit-kirschli.pages.dev/" target="_blank" rel="noopener">
    See more
  </a>

</body>
</html>
